<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — CRIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.rings.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; font-family: 'Poppins', sans-serif; }
        #vanta-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        nav { position: relative; z-index: 10; }

        .auth-wrapper {
            position: relative; z-index: 5;
            display: flex; min-height: 100vh;
            align-items: center; justify-content: center;
            padding: 80px 1.5rem 2rem;
        }

        .auth-card {
            width: 100%; max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px; padding: 2.75rem 2.5rem;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 32px 80px rgba(0,0,0,0.4);
        }

        .icon-wrap {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, rgba(124,58,237,0.15), rgba(79,172,254,0.15));
            border: 1px solid rgba(124,58,237,0.25);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; color: #a78bfa;
            margin-bottom: 1.5rem;
        }

        h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; }
        .subtitle { color: var(--secondary-text); font-size: 0.88rem; line-height: 1.65; margin-bottom: 2rem; }

        .form-field { margin-bottom: 1.25rem; }
        .form-field label {
            display: block; font-size: 0.75rem; font-weight: 600;
            color: var(--secondary-text); margin-bottom: 0.4rem;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute; left: 1rem; top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-text); font-size: 1.1rem; pointer-events: none;
        }
        .input-wrap input {
            width: 100%; padding: 0.85rem 1rem 0.85rem 2.75rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color); border-radius: 10px;
            color: var(--text-color); font-family: 'Poppins', sans-serif;
            font-size: 0.9rem; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrap input:focus {
            outline: none; border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124,58,237,0.12);
        }

        .auth-submit-btn {
            width: 100%; padding: 0.9rem;
            background: linear-gradient(135deg, #7c3aed 0%, #4facfe 100%);
            color: #fff; border: none; border-radius: 12px;
            font-family: 'Poppins', sans-serif; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: opacity 0.2s, transform 0.1s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .auth-submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .auth-submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .resend-btn {
            width: 100%; padding: 0.8rem;
            background: transparent; border: 1px solid var(--border-color);
            border-radius: 12px; color: var(--secondary-text);
            font-family: 'Poppins', sans-serif; font-size: 0.88rem; font-weight: 500;
            cursor: pointer; margin-top: 0.75rem;
            display: none; align-items: center; justify-content: center; gap: 0.4rem;
            transition: border-color 0.2s, color 0.2s;
        }
        .resend-btn:hover { border-color: #7c3aed; color: #a78bfa; }

        .back-link {
            display: inline-flex; align-items: center; gap: 0.3rem;
            margin-top: 1.5rem; font-size: 0.82rem;
            color: var(--secondary-text); text-decoration: none; transition: color 0.2s;
        }
        .back-link:hover { color: var(--text-color); }
    </style>
</head>
<body>
    <div id="vanta-bg"></div>

    <nav>
        <div class="nav-left">
            <a href="getstarted.html" style="text-decoration:none;">
                <div class="logo" style="display:flex;align-items:center;">
                    <img src="logo.png" alt="CRIP" style="height:38px;">
                </div>
            </a>
        </div>
        <div class="nav-center"></div>
        <div class="nav-right">
            <a href="login.html" class="cta-btn" style="padding:0.5rem 1.2rem;font-size:0.9rem;">Log In</a>
            <button class="theme-toggle" id="theme-toggle" title="Toggle Light/Dark Mode"><i class='bx bx-moon'></i></button>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="icon-wrap">
                <i class='bx bx-key'></i>
            </div>

            <h1>Forgot your password?</h1>
            <p class="subtitle">No worries. Enter your registered email below and we'll send you a 6-digit recovery code instantly.</p>

            <form id="forgotPasswordForm">
                <div class="form-field">
                    <label for="recoveryEmail">Registered Email</label>
                    <div class="input-wrap">
                        <i class='bx bx-envelope'></i>
                        <input type="email" id="recoveryEmail" placeholder="you@company.com" required autocomplete="email">
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn" id="sendOtpBtn">
                    Send Recovery Code <i class='bx bx-envelope'></i>
                </button>
                <button type="button" id="resendOtpBtn" class="resend-btn">
                    <i class='bx bx-refresh'></i> Resend Code
                </button>
            </form>

            <a href="login.html" class="back-link">
                <i class='bx bx-left-arrow-alt'></i> Back to Login
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
