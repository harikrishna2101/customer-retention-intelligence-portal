<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpdesk - CRIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.rings.min.js"></script>
    <style>
        .hd-container { padding: 100px 5% 4rem; max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .glass { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; backdrop-filter: blur(10px); }
        [data-theme='dark'] .glass { background: rgba(15,15,15,0.75); border-color: rgba(255,255,255,0.06); }
        .filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.1rem; align-items: center; }
        .chip { padding: 0.28rem 0.8rem; border-radius: 99px; font-size: 0.76rem; font-weight: 600; border: 1px solid var(--border-color); background: transparent; color: var(--secondary-text); cursor: pointer; transition: all 0.2s; font-family: 'Poppins', sans-serif; }
        .chip.active { background: var(--text-color); color: var(--bg-color); border-color: var(--text-color); }
        .ticket-row { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 0.9rem 1.1rem; display: flex; align-items: center; gap: 1rem; transition: all 0.2s; cursor: pointer; }
        [data-theme='dark'] .ticket-row { background: rgba(15,15,15,0.75); border-color: rgba(255,255,255,0.06); }
        .ticket-row:hover { border-color: var(--risk-blue); }
        .ticket-row.sla { border-left: 3px solid var(--risk-red); }
        .sla-tag { background: rgba(255,51,51,0.1); color: var(--risk-red); border: 1px solid rgba(255,51,51,0.2); border-radius: 99px; font-size: 0.62rem; font-weight: 700; padding: 0.12rem 0.4rem; text-transform: uppercase; letter-spacing: 0.06em; }
        .prio-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .t-name { font-weight: 600; font-size: 0.88rem; }
        .t-sub { font-size: 0.75rem; color: var(--secondary-text); margin-top: 0.1rem; }
        .score-tag { padding: 0.15rem 0.5rem; border-radius: 99px; font-size: 0.65rem; font-weight: 700; }
        .st-high { background: rgba(255,51,51,0.12); color: var(--risk-red); border: 1px solid rgba(255,51,51,0.2); }
        .st-warn { background: rgba(242,186,0,0.12); color: var(--risk-yellow); border: 1px solid rgba(242,186,0,0.2); }
        .st-safe { background: rgba(0,179,65,0.12); color: var(--risk-green); border: 1px solid rgba(0,179,65,0.2); }
        .status-open { background: rgba(255,51,51,0.1); color: var(--risk-red); border: 1px solid rgba(255,51,51,0.2); }
        .status-prog { background: rgba(242,186,0,0.1); color: var(--risk-yellow); border: 1px solid rgba(242,186,0,0.2); }
        .status-res  { background: rgba(0,179,65,0.1); color: var(--risk-green); border: 1px solid rgba(0,179,65,0.2); }
        .status-close{ background: var(--hover-bg); color: var(--secondary-text); border: 1px solid var(--border-color); }
        .status-tag { padding: 0.15rem 0.5rem; border-radius: 99px; font-size: 0.65rem; font-weight: 700; }
        .resolve-btn { padding: 0.35rem 0.85rem; font-size: 0.75rem; font-weight: 600; border-radius: 6px; border: 1px solid var(--border-color); background: transparent; color: var(--text-color); cursor: pointer; font-family: 'Poppins', sans-serif; transition: all 0.2s; white-space: nowrap; }
        .resolve-btn:hover { background: var(--hover-bg); }
        .resolve-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        /* Modal */
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); z-index: 999; justify-content: center; align-items: center; }
        .modal-bg.open { display: flex; }
        .modal-box { background: var(--bg-color); padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 480px; position: relative; }
        [data-theme='dark'] .modal-box { background: #0f0f0f; }
        .form-row { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
        .form-row label { font-size: 0.8rem; font-weight: 600; color: var(--secondary-text); }
        .form-input { background: var(--hover-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.6rem 0.9rem; color: var(--text-color); font-family: 'Poppins', sans-serif; font-size: 0.875rem; outline: none; width: 100%; transition: border-color 0.2s; }
        .form-input:focus { border-color: var(--risk-blue); }
        /* Stats grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
        @media(max-width:900px){ .stats-grid{grid-template-columns:1fr 1fr;} }
        .stat-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.1rem 1.25rem; backdrop-filter: blur(10px); }
        [data-theme='dark'] .stat-box { background: rgba(15,15,15,0.75); border-color: rgba(255,255,255,0.06); }
        .stat-label { font-size: 0.72rem; font-weight: 600; color: var(--secondary-text); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.35rem; }
        .stat-val { font-size: 1.9rem; font-weight: 700; line-height: 1; }
    </style>
</head>
<body>
    <div id="vanta-bg"></div>
    <script>
        var BASE_URL = "";
        async function verifySession() {
            try {
                const res = await fetch(`${BASE_URL}/api/auth/verify-session`, { method: "GET", credentials: "include" });
                if (!res.ok) window.location.href = "login.html";
            } catch (err) { window.location.href = "login.html"; }
        }
        verifySession();
        async function handleSignOut() {
            try { await fetch(`${BASE_URL}/api/auth/logout`, { method: "POST", credentials: "include" }); } catch(e) {}
            window.location.href = "login.html";
        }
    </script>

    <nav>
        <div class="nav-left">
            <a href="home.html" style="text-decoration:none;">
                <div class="logo" style="display:flex; align-items:center;">
                    <img src="logo.png" alt="CRIP" style="height: 38px;">
                </div>
            </a>
        </div>
        <div class="nav-center" style="display:flex; gap:2rem; align-items:center;">
            <a href="home.html" class="nav-link">Home</a>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="reports.html" class="nav-link">Reports</a>
            <a href="grow.html" class="nav-link">Grow Corner</a>
            <a href="profile.html" class="nav-link">Profile</a>
        </div>
        <div class="nav-right">
            <button class="theme-toggle" id="theme-toggle" style="margin-right:1rem;"><i class='bx bx-moon'></i></button>
            <button onclick="handleSignOut()" class="cta-btn" style="padding:0.5rem 1.2rem; font-size:0.9rem; background:#cc3333;">Sign Out</button>
        </div>
    </nav>

    <!-- New Ticket Modal -->
    <div class="modal-bg" id="ticketModal">
        <div class="modal-box">
            <button onclick="closeModal()" style="position:absolute;top:1.25rem;right:1.25rem;background:none;border:none;cursor:pointer;color:var(--secondary-text);font-size:1.4rem;"><i class='bx bx-x'></i></button>
            <h2 style="margin-bottom:1.25rem;font-size:1.2rem;"><i class='bx bx-plus-circle' style="color:var(--risk-green);"></i> Create New Ticket</h2>
            <div class="form-row"><label>Customer Name</label><input class="form-input" id="ntCustomer" placeholder="e.g. Akira Tanaka"/></div>
            <div class="form-row"><label>Issue Category</label>
                <select class="form-input" id="ntCategory"><option>Billing</option><option>Technical</option><option>Service Quality</option><option>Account Access</option><option>Other</option></select>
            </div>
            <div class="form-row"><label>Priority</label>
                <select class="form-input" id="ntPriority"><option>High</option><option>Medium</option><option>Low</option></select>
            </div>
            <div class="form-row"><label>Description</label><textarea class="form-input" id="ntDesc" rows="3" placeholder="Describe the issue…" style="resize:none;"></textarea></div>
            <div style="display:flex;gap:0.75rem;margin-top:0.5rem;">
                <button onclick="closeModal()" style="flex:1;padding:0.65rem;border-radius:8px;border:1px solid var(--border-color);background:transparent;color:var(--text-color);cursor:pointer;font-family:'Poppins',sans-serif;font-weight:600;">Cancel</button>
                <button onclick="createTicket()" class="cta-btn" style="flex:1;padding:0.65rem;font-size:0.9rem;border:none;border-radius:8px;"><i class='bx bx-plus'></i> Create Ticket</button>
            </div>
        </div>
    </div>

    <div class="hd-container">
        <!-- Header -->
        <div style="display:flex; justify-content:space-between; align-items:center; background:var(--card-bg); padding:1.5rem 2rem; border-radius:12px; border:1px solid var(--border-color); backdrop-filter:blur(10px);">
            <div>
                <h1 style="font-size:1.8rem; font-weight:600;"><i class='bx bx-support' style="color:var(--risk-blue); vertical-align:middle; margin-right:0.5rem;"></i>Helpdesk</h1>
                <p style="color:var(--secondary-text); font-size:0.9rem; margin-top:0.25rem;">Manage customer support tickets — SLA-tracked, churn-linked</p>
            </div>
            <button onclick="openModal()" class="cta-btn" style="padding:0.6rem 1.2rem; font-size:0.85rem;"><i class='bx bx-plus'></i> New Ticket</button>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-box"><div class="stat-label">Open Tickets</div><div class="stat-val" id="statOpen" style="color:var(--risk-red);">0</div></div>
            <div class="stat-box"><div class="stat-label">In Progress</div><div class="stat-val" id="statProg" style="color:var(--risk-yellow);">0</div></div>
            <div class="stat-box"><div class="stat-label">Resolved</div><div class="stat-val" id="statRes" style="color:var(--risk-green);">0</div></div>
            <div class="stat-box"><div class="stat-label">SLA Compliance</div><div class="stat-val" style="color:var(--risk-blue);">87%</div></div>
        </div>

        <!-- SLA Alert -->
        <div id="slaAlert" style="display:none; background:rgba(255,51,51,0.08); border:1px solid rgba(255,51,51,0.25); border-radius:10px; padding:0.8rem 1rem; display:flex; align-items:center; gap:0.65rem; color:var(--risk-red); font-size:0.85rem;">
            <i class='bx bx-alarm-exclamation' style="font-size:1.1rem;"></i>
            <span id="slaAlertText"></span>
        </div>

        <!-- Filters + Search -->
        <div style="display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;">
            <div class="filter-bar" style="margin-bottom:0;">
                <button class="chip active" onclick="setFilter('all',this)">All</button>
                <button class="chip" onclick="setFilter('Open',this)">Open</button>
                <button class="chip" onclick="setFilter('In Progress',this)">In Progress</button>
                <button class="chip" onclick="setFilter('Resolved',this)">Resolved</button>
                <button class="chip" onclick="setFilter('Closed',this)">Closed</button>
            </div>
            <div style="margin-left:auto;position:relative;">
                <i class='bx bx-search' style="position:absolute;left:0.6rem;top:50%;transform:translateY(-50%);color:var(--secondary-text);pointer-events:none;"></i>
                <input style="padding:0.5rem 0.75rem 0.5rem 2rem;background:rgba(255,255,255,0.05);border:1px solid var(--border-color);border-radius:8px;color:var(--text-color);font-size:0.85rem;width:200px;outline:none;font-family:'Poppins',sans-serif;" placeholder="Search…" oninput="renderTickets()" id="ticketSearch"/>
            </div>
        </div>

        <!-- Ticket List -->
        <div id="ticketList" style="display:flex;flex-direction:column;gap:0.55rem;"></div>
    </div>

    <script src="script.js"></script>
    <script src="nav.js"></script>
    <script>
    // ── Helpdesk — Derived from live /api/data/customers ──
    const PAGE_SIZE = 25;
    let allTickets  = [];  // all loaded from API
    let localNew    = [];  // tickets created via form (session-only)
    let filter      = 'all';
    let currentPage = 1;

    // Derive a ticket record from a customer DB record
    function toTicket(c, idx) {
        const score = Math.round(parseFloat(c.risk_score) || 0);
        const risk  = (c.risk_level || '').toLowerCase();
        const name  = c.name || c.customer_name || c.Name || c.customerID || 'Customer';
        const seg   = c.industry || c.segment || c.Industry || '—';
        const cat   = score >= 70 ? 'Technical' : score >= 50 ? 'Service Quality' : 'Account Access';
        const prio  = score >= 75 ? 'High' : score >= 50 ? 'Medium' : 'Low';
        const status = risk.includes('high') ? 'Open' : risk.includes('warn') || risk.includes('med') ? 'In Progress' : 'Resolved';
        const age   = Math.ceil(score / 10); // synthetic age in days
        return {
            id: 'T-' + String(9000 + idx).padStart(4, '0'),
            customer: name,
            customerID: c.customerID,
            seg, cat, prio, status,
            desc: `Churn risk score: ${score}% — automated ticket from ML engine.`,
            age, risk: score
        };
    }

    const stClass = s => s==='Open'?'status-open':s==='In Progress'?'status-prog':s==='Resolved'?'status-res':'status-close';
    const rClass  = r => r>=75?'st-high':r>=50?'st-warn':'st-safe';

    async function loadTicketsFromCustomersDeprecated() {
        document.getElementById('ticketList').innerHTML = '<p style="text-align:center;color:var(--secondary-text);padding:2rem;"><i class="bx bx-loader-alt bx-spin"></i> Loading tickets from dataset…</p>';
        try {
            // Fetch ALL customers (sorted by risk desc) to build ticket list
            const res = await fetch('/api/data/customers?limit=10000', { credentials: 'include' });
            if (!res.ok) throw new Error('API ' + res.status);
            const data = await res.json();
            if (!data.success) throw new Error(data.message);

            // Only create tickets for customers with some risk (skip very safe ones to reduce noise)
            allTickets = data.customers
                .filter(c => parseFloat(c.risk_score) >= 30)
                .map((c, i) => toTicket(c, i));

            renderTickets();
        } catch (err) {
            console.error('Helpdesk load error:', err);
            document.getElementById('ticketList').innerHTML = '<p style="text-align:center;color:var(--risk-red);padding:2rem;"><i class="bx bx-error-circle"></i> Failed to load data. Upload a CSV first.</p>';
        }
    }

    function getVisible() {
        const q = (document.getElementById('ticketSearch') || {}).value || '';
        const qLower = q.toLowerCase();
        let data = [...localNew, ...allTickets];
        if (filter !== 'all') data = data.filter(t => t.status === filter);
        if (qLower) data = data.filter(t =>
            t.customer.toLowerCase().includes(qLower) ||
            t.id.toLowerCase().includes(qLower) ||
            t.cat.toLowerCase().includes(qLower)
        );
        return data;
    }

    function renderTickets() {
        const all    = getVisible();
        const total  = all.length;
        const pages  = Math.max(1, Math.ceil(total / PAGE_SIZE));
        currentPage  = Math.min(currentPage, pages);
        const start  = (currentPage - 1) * PAGE_SIZE;
        const data   = all.slice(start, start + PAGE_SIZE);

        // Stats (always over all tickets, ignoring filter)
        const combined = [...localNew, ...allTickets];
        document.getElementById('statOpen').textContent = combined.filter(t => t.status === 'Open').length;
        document.getElementById('statProg').textContent = combined.filter(t => t.status === 'In Progress').length;
        document.getElementById('statRes').textContent  = combined.filter(t => t.status === 'Resolved').length;

        // SLA alert
        const breached = combined.filter(t => t.age > 2 && (t.status === 'Open' || t.status === 'In Progress'));
        const slaEl = document.getElementById('slaAlert');
        if (breached.length) {
            slaEl.style.display = 'flex';
            document.getElementById('slaAlertText').textContent = breached.length + ' ticket(s) have breached 48h SLA — immediate action required!';
        } else { slaEl.style.display = 'none'; }

        if (!data.length) {
            document.getElementById('ticketList').innerHTML = '<p style="text-align:center;color:var(--secondary-text);padding:2rem;">No tickets found.</p>';
            renderPagination(0, 1, 1);
            return;
        }

        document.getElementById('ticketList').innerHTML = data.map(t => `
        <div class="ticket-row ${t.age > 2 && (t.status === 'Open' || t.status === 'In Progress') ? 'sla' : ''}">
            <div class="prio-dot" style="background:${t.prio==='High'?'var(--risk-red)':t.prio==='Medium'?'var(--risk-yellow)':'var(--risk-green)'};"></div>
            <div style="flex:1;min-width:0;">
                <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
                    <span class="t-name">${t.customer}</span>
                    ${t.risk > 0 ? `<span class="score-tag ${rClass(t.risk)}">${t.risk}% risk</span>` : ''}
                    ${t.age > 2 && (t.status === 'Open' || t.status === 'In Progress') ? '<span class="sla-tag">SLA Breach</span>' : ''}
                </div>
                <div class="t-sub">${t.displayId || t.id} · ${t.cat} · ${t.seg}</div>
                <div class="t-sub" style="font-style:italic;margin-top:0.15rem;">${t.desc}</div>
            </div>
            <div style="text-align:right;flex-shrink:0;">
                <span class="status-tag ${stClass(t.status)}">${t.status}</span>
                <div style="font-size:0.7rem;color:var(--secondary-text);margin-top:0.35rem;">${t.age}d old</div>
            </div>
            <button class="resolve-btn" onclick="resolveTicket('${t.id}')" ${(t.status==='Closed'||t.status==='Resolved')?'disabled':''}>
                ${!t.persisted ? 'Create' : (t.status==='Closed'||t.status==='Resolved') ? 'Done' : 'Resolve'}
            </button>
        </div>`).join('');

        renderPagination(total, currentPage, pages);
    }

    function renderPagination(total, page, pages) {
        let el = document.getElementById('hdPagination');
        if (!el) {
            el = document.createElement('div');
            el.id = 'hdPagination';
            el.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-top:1rem;font-size:0.82rem;color:var(--secondary-text);';
            document.getElementById('ticketList').after(el);
        }
        if (total === 0) { el.innerHTML = ''; return; }
        el.innerHTML = `
            <span>${total} ticket${total !== 1 ? 's' : ''} · Page ${page} of ${pages}</span>
            <div style="display:flex;gap:0.5rem;">
                <button onclick="changePage(-1)" style="padding:0.35rem 0.75rem;border:1px solid var(--border-color);border-radius:6px;background:transparent;color:var(--text-color);cursor:pointer;font-family:'Poppins',sans-serif;font-size:0.78rem;" ${page <= 1 ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>‹ Prev</button>
                <button onclick="changePage(1)"  style="padding:0.35rem 0.75rem;border:1px solid var(--border-color);border-radius:6px;background:transparent;color:var(--text-color);cursor:pointer;font-family:'Poppins',sans-serif;font-size:0.78rem;" ${page >= pages ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>Next ›</button>
            </div>`;
    }

    function changePage(delta) { currentPage = Math.max(1, currentPage + delta); renderTickets(); window.scrollTo(0, 0); }
    function setFilter(f, btn) { filter = f; currentPage = 1; document.querySelectorAll('.chip').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderTickets(); }
    function resolveTicketLocalDeprecated(id) {
        let t = localNew.find(x => x.id === id) || allTickets.find(x => x.id === id);
        if (t && t.status !== 'Resolved' && t.status !== 'Closed') { t.status = 'Resolved'; renderTickets(); }
    }
    function openModal()  { document.getElementById('ticketModal').classList.add('open'); }
    function closeModal() { document.getElementById('ticketModal').classList.remove('open'); }
    function createTicketLocalDeprecated() {
        const cust = document.getElementById('ntCustomer').value.trim();
        if (!cust) { alert('Please enter a customer name.'); return; }
        localNew.unshift({
            id: 'T-' + Date.now().toString().slice(-6),
            customer: cust, customerID: '', seg: '—',
            cat: document.getElementById('ntCategory').value,
            prio: document.getElementById('ntPriority').value,
            status: 'Open',
            desc: document.getElementById('ntDesc').value || 'No description.',
            age: 0, risk: 0
        });
        closeModal();
        document.getElementById('ntCustomer').value = '';
        document.getElementById('ntDesc').value = '';
        currentPage = 1;
        renderTickets();
    }

    function toTicketFromDb(t) {
        const age = Math.max(0, Math.ceil((Date.now() - new Date(t.createdAt || Date.now())) / (1000 * 60 * 60 * 24)));
        return {
            id: t._id,
            displayId: 'T-' + String(t._id).slice(-6).toUpperCase(),
            customer: t.customerName,
            customerID: t.customerID,
            seg: 'Saved ticket',
            cat: t.category,
            prio: t.priority,
            status: t.status,
            desc: t.description || 'No description.',
            age,
            risk: t.riskScore || 0,
            persisted: true
        };
    }

    async function loadTickets() {
        document.getElementById('ticketList').innerHTML = '<p style="text-align:center;color:var(--secondary-text);padding:2rem;"><i class="bx bx-loader-alt bx-spin"></i> Loading support tickets...</p>';
        try {
            const [ticketRes, customerRes] = await Promise.all([
                fetch('/api/data/tickets', { credentials: 'include' }),
                fetch('/api/data/customers?limit=500', { credentials: 'include' })
            ]);
            const ticketData = await ticketRes.json();
            const customerData = await customerRes.json();
            if (!customerData.success) throw new Error(customerData.message);

            localNew = ticketData.success ? ticketData.tickets.map(toTicketFromDb) : [];
            const ticketedIds = new Set(localNew.map(t => t.customerID).filter(Boolean));
            allTickets = customerData.customers
                .filter(c => parseFloat(c.risk_score) >= 30 && !ticketedIds.has(c.customerID))
                .map((c, i) => ({ ...toTicket(c, i), persisted: false, displayId: 'Suggested' }));

            renderTickets();
        } catch (err) {
            console.error('Helpdesk load error:', err);
            document.getElementById('ticketList').innerHTML = '<p style="text-align:center;color:var(--risk-red);padding:2rem;"><i class="bx bx-error-circle"></i> Failed to load support tickets.</p>';
        }
    }

    async function resolveTicket(id) {
        let t = localNew.find(x => x.id === id) || allTickets.find(x => x.id === id);
        if (!t || t.status === 'Resolved' || t.status === 'Closed') return;
        if (!t.persisted) {
            try {
                const res = await fetch('/api/data/tickets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        customerID: t.customerID,
                        customerName: t.customer,
                        category: t.cat,
                        priority: t.prio,
                        description: t.desc
                    })
                });
                if (!res.ok) throw new Error('create failed');
                await loadTickets();
            } catch (err) {
                alert('Failed to create ticket.');
            }
            return;
        }
        try {
            const res = await fetch('/api/data/tickets/' + encodeURIComponent(id), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ status: 'Resolved' })
            });
            if (!res.ok) throw new Error('resolve failed');
            await loadTickets();
        } catch (err) {
            alert('Failed to resolve ticket.');
        }
    }

    async function createTicket() {
        const cust = document.getElementById('ntCustomer').value.trim();
        if (!cust) { alert('Please enter a customer name.'); return; }
        try {
            const res = await fetch('/api/data/tickets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    customerName: cust,
                    category: document.getElementById('ntCategory').value,
                    priority: document.getElementById('ntPriority').value,
                    description: document.getElementById('ntDesc').value || 'No description.'
                })
            });
            if (!res.ok) throw new Error('create failed');
            closeModal();
            document.getElementById('ntCustomer').value = '';
            document.getElementById('ntDesc').value = '';
            currentPage = 1;
            await loadTickets();
        } catch (err) {
            alert('Failed to create ticket.');
        }
    }

    loadTickets();
    </script>
</body>
</html>
