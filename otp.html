<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP — CRIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.rings.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; font-family: 'Poppins', sans-serif; }
        #vanta-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        nav { position: relative; z-index: 10; }

        .auth-wrapper {
            position: relative; z-index: 5;
            display: flex; min-height: 100vh;
            align-items: center; justify-content: center;
            padding: 80px 1.5rem 2rem;
        }

        .auth-card {
            width: 100%; max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px; padding: 2.75rem 2.5rem;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 32px 80px rgba(0,0,0,0.4);
            text-align: center;
        }

        .otp-icon {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, rgba(124,58,237,0.15), rgba(79,172,254,0.15));
            border: 1px solid rgba(124,58,237,0.3);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem; color: #a78bfa;
        }

        .auth-card h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; }
        .auth-card .subtitle { color: var(--secondary-text); font-size: 0.88rem; line-height: 1.6; margin-bottom: 2rem; }

        .email-badge {
            display: inline-flex; align-items: center; gap: 0.4rem;
            background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.2);
            border-radius: 100px; padding: 0.3rem 0.9rem;
            font-size: 0.8rem; color: #c4b5fd;
            margin-bottom: 1.75rem;
        }

        .otp-input-wrap {
            margin-bottom: 1.5rem;
        }

        .otp-input-wrap label {
            display: block; font-size: 0.75rem; font-weight: 600;
            color: var(--secondary-text); margin-bottom: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.05em;
        }

        #otp {
            width: 100%;
            padding: 1.1rem;
            background: rgba(255,255,255,0.04);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #otp:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124,58,237,0.15);
        }

        .auth-submit-btn {
            width: 100%; padding: 0.9rem;
            background: linear-gradient(135deg, #7c3aed 0%, #4facfe 100%);
            color: #fff; border: none; border-radius: 12px;
            font-family: 'Poppins', sans-serif; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: opacity 0.2s, transform 0.1s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .auth-submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .auth-submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .resend-btn {
            width: 100%; padding: 0.8rem;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--secondary-text);
            font-family: 'Poppins', sans-serif; font-size: 0.88rem; font-weight: 500;
            cursor: pointer; margin-top: 0.75rem;
            transition: border-color 0.2s, color 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 0.4rem;
        }
        .resend-btn:hover { border-color: #7c3aed; color: #a78bfa; }
        .resend-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .back-link {
            display: inline-flex; align-items: center; gap: 0.3rem;
            margin-top: 1.5rem; font-size: 0.82rem;
            color: var(--secondary-text); text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--text-color); }

        .timer-note {
            font-size: 0.75rem; color: var(--secondary-text);
            margin-top: 0.6rem;
        }
    </style>
</head>
<body>
    <div id="vanta-bg"></div>

    <nav>
        <div class="nav-left">
            <a href="getstarted.html" style="text-decoration:none;">
                <div class="logo" style="display:flex;align-items:center;">
                    <img src="logo.png" alt="CRIP" style="height:38px;">
                </div>
            </a>
        </div>
        <div class="nav-center"></div>
        <div class="nav-right">
            <a href="login.html" class="cta-btn" style="padding:0.5rem 1.2rem;font-size:0.9rem;">Log In</a>
            <button class="theme-toggle" id="theme-toggle" title="Toggle Light/Dark Mode"><i class='bx bx-moon'></i></button>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="otp-icon">
                <i class='bx bx-shield-quarter'></i>
            </div>

            <h1>Check your inbox</h1>
            <p class="subtitle">We dispatched a secure 6-digit code to your registered email address.</p>

            <div class="email-badge">
                <i class='bx bx-envelope'></i>
                <span id="otp-email-display">your email</span>
            </div>

            <form id="otpForm">
                <div class="otp-input-wrap">
                    <label for="otp">Enter 6-Digit Code</label>
                    <input type="text" id="otp" placeholder="000000" maxlength="6" required autocomplete="one-time-code" inputmode="numeric">
                </div>
                <p class="timer-note"><i class='bx bx-time-five'></i> Code expires in 10 minutes</p>
                <br>
                <button type="submit" class="auth-submit-btn">
                    <i class='bx bx-check-shield'></i> Verify &amp; Access Dashboard
                </button>
        <button type="button" class="resend-btn" id="resend-otp-btn" onclick="resendOTP()">
                    <i class='bx bx-log-in-circle'></i> Re-authenticate & Get New Code
                </button>
            </form>

            <a href="login.html" class="back-link">
                <i class='bx bx-left-arrow-alt'></i> Back to Login
            </a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Show stored email in the badge
        const storedEmail = localStorage.getItem('email');
        if (storedEmail) {
            document.getElementById('otp-email-display').textContent = storedEmail;
        }

        async function resendOTP() {
            const email = localStorage.getItem("email");
            if (!email) {
                alert("Session expired. Redirecting to login.");
                window.location.href = "login.html";
                return;
            }
            const btn = document.getElementById('resend-otp-btn');
            btn.innerHTML = "<i class='bx bx-loader-alt bx-spin'></i> Redirecting...";
            btn.disabled = true;
            // OTP is tied to login credentials — redirect to re-authenticate
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
