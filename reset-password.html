<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — CRIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.rings.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; font-family: 'Poppins', sans-serif; }
        #vanta-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        nav { position: relative; z-index: 10; }

        .auth-wrapper {
            position: relative; z-index: 5;
            display: flex; min-height: 100vh;
            align-items: center; justify-content: center;
            padding: 80px 1.5rem 2rem;
        }

        .auth-card {
            width: 100%; max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px; padding: 2.75rem 2.5rem;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 32px 80px rgba(0,0,0,0.4);
        }

        .icon-wrap {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, rgba(34,197,94,0.12), rgba(79,172,254,0.12));
            border: 1px solid rgba(34,197,94,0.25);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; color: #4ade80;
            margin-bottom: 1.5rem;
        }

        h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; }
        .subtitle { color: var(--secondary-text); font-size: 0.88rem; line-height: 1.65; margin-bottom: 2rem; }

        .form-field { margin-bottom: 1.1rem; }
        .form-field label {
            display: block; font-size: 0.75rem; font-weight: 600;
            color: var(--secondary-text); margin-bottom: 0.4rem;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute; left: 1rem; top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-text); font-size: 1.1rem; pointer-events: none;
        }
        .input-wrap input {
            width: 100%; padding: 0.85rem 1rem 0.85rem 2.75rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color); border-radius: 10px;
            color: var(--text-color); font-family: 'Poppins', sans-serif;
            font-size: 0.9rem; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrap input:focus {
            outline: none; border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,0.1);
        }

        /* OTP field special styling */
        #resetOtp {
            text-align: center; font-size: 1.6rem;
            font-weight: 700; letter-spacing: 12px;
            padding: 0.9rem 1rem;
        }

        .auth-submit-btn {
            width: 100%; padding: 0.9rem;
            background: linear-gradient(135deg, #22c55e 0%, #4facfe 100%);
            color: #fff; border: none; border-radius: 12px;
            font-family: 'Poppins', sans-serif; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: opacity 0.2s, transform 0.1s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            margin-top: 1.25rem;
        }
        .auth-submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .auth-submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .divider { border: none; border-top: 1px solid var(--border-color); margin: 1.5rem 0; }

        .back-link {
            display: inline-flex; align-items: center; gap: 0.3rem;
            font-size: 0.82rem; color: var(--secondary-text);
            text-decoration: none; transition: color 0.2s;
        }
        .back-link:hover { color: var(--text-color); }
    </style>
</head>
<body>
    <div id="vanta-bg"></div>

    <nav>
        <div class="nav-left">
            <a href="getstarted.html" style="text-decoration:none;">
                <div class="logo" style="display:flex;align-items:center;">
                    <img src="logo.png" alt="CRIP" style="height:38px;">
                </div>
            </a>
        </div>
        <div class="nav-center"></div>
        <div class="nav-right">
            <a href="login.html" class="cta-btn" style="padding:0.5rem 1.2rem;font-size:0.9rem;">Log In</a>
            <button class="theme-toggle" id="theme-toggle" title="Toggle Light/Dark Mode"><i class='bx bx-moon'></i></button>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="icon-wrap">
                <i class='bx bx-lock-open-alt'></i>
            </div>

            <h1>Set new password</h1>
            <p class="subtitle">Enter the 6-digit recovery code we sent you and choose a strong new password.</p>

            <form id="resetPasswordForm">
                <div class="form-field">
                    <label for="resetOtp">Recovery Code</label>
                    <div class="input-wrap">
                        <i class='bx bx-key' style="z-index:2;"></i>
                        <input type="text" id="resetOtp" placeholder="000000" maxlength="6" required autocomplete="one-time-code" inputmode="numeric">
                    </div>
                </div>

                <div class="form-field">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrap">
                        <i class='bx bx-lock-alt'></i>
                        <input type="password" id="newPassword" placeholder="Min. 6 characters" required autocomplete="new-password">
                    </div>
                </div>

                <div class="form-field">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrap">
                        <i class='bx bx-check-circle'></i>
                        <input type="password" id="confirmPassword" placeholder="Re-enter new password" required autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn">
                    <i class='bx bx-check-shield'></i> Reset Password
                </button>
            </form>

            <hr class="divider">
            <a href="forgot-password.html" class="back-link">
                <i class='bx bx-left-arrow-alt'></i> Request a new code
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
